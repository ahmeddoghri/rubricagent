name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  adversarial:
    # The grounding grader can regress silently: it keeps producing a score,
    # it just stops meaning anything. This fails the build if the fixed
    # grader's grounding correlation drops on realistic text.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install -e .
      - name: Run the grounding + false-discovery benchmark
        run: |
          python -m rubricagent.eval_v2
          python - <<'EOF'
          from rubricagent.eval_v2 import build_report

          report = build_report()
          for corpus in ("adversarial", "holdout"):
              v2 = report[corpus]["v2"]
              assert v2["grounding_correlation"] > 0.5, (corpus, v2)
              assert v2["auc_after"] >= 0.9, (corpus, v2)
          print("grounding correlation and AUC hold on realistic text")
          EOF

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Run example
        run: python examples/quickstart.py
      - name: Run benchmark
        run: python -m rubricagent.eval
